name = "nist-rmf-portal"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../../apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "nist-rmf-db"
database_id = "8ec58aaa-a6dd-4283-9515-d6866affe319"

[[r2_buckets]]
binding = "EVIDENCE"
bucket_name = "nist-rmf-evidence"

[vars]
ENVIRONMENT = "prod"

# Optional OIDC/IdP configuration (uncomment and set to enable external IdP login)
# [vars]
# OIDC_ISSUER = "https://your-idp.example.com"
# OIDC_CLIENT_ID = "your-client-id"
# OIDC_CLIENT_SECRET = "your-client-secret"
# OIDC_REDIRECT_URI = "https://nist-rmf-portal.axoss.workers.dev/api/auth/oidc/callback"

[triggers]
crons = ["0 6 * * *"]
